name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  firebase_auth: ^4.17.0
  firebase_core: ^2.25.0
  cloud_firestore: ^4.15.0
  provider: ^6.0.5
  google_fonts: ^6.1.0
  rename: ^3.1.0
  cloudinary_public: ^0.23.1
  image_picker: ^1.0.7
  http: ^1.2.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  pdf: ^3.10.8
  printing: ^5.12.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#F5F8FD"
  image: assets/splash.png

  android: true
  ios: true

  android_12:
    color: "#F5F8FD"
    image: assets/splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/1.png
    - assets/b2.png
    - assets/banner.png
    - assets/splash.png

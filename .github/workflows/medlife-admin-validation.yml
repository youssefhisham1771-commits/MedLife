name: MedLife Admin Validation

on:
  pull_request:
    branches: [main, security/firestore-role-permissions]
  push:
    branches:
      - security/firestore-role-permissions
      - fix/admin-emulator-diagnostics

permissions:
  contents: read

jobs:
  validate-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node --check functions/index.js

  validate-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Install dependencies
        working-directory: medlife_admin
        run: flutter pub get
      - name: Analyze Dart
        working-directory: medlife_admin
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: medlife_admin
        run: flutter test
      - name: Build admin web
        working-directory: medlife_admin
        run: flutter build web
